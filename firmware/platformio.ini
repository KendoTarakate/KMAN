; KMAN — sensor streaming firmware (Seeed XIAO nRF52840).
;
; Pick the environment that matches the sensors you wired:
;   xiao_nrf52840          chest IMU (0x6A) + neck flex           <- bench default
;   xiao_nrf52840_abdomen  chest IMU (0x6A) + abdomen IMU (0x6B) + neck flex
;   xiao_nrf52840_neck     chest IMU (0x6A) + neck IMU (0x6B) + neck flex
;
; Build:   pio run -e xiao_nrf52840
; Flash:   pio run -e xiao_nrf52840 -t upload   (double-tap RESET if the port isn't found)
; Every build also writes .pio/build/<env>/kman-fw-<version>-<env>.uf2 for
; drag-and-drop flashing. See docs/FIRMWARE_GUIDE.md.
;
; Every KMAN_* setting in include/config.h can be overridden with build_flags,
; e.g. -DKMAN_SAMPLE_RATE_HZ=200

[platformio]
default_envs = xiao_nrf52840

[env]
framework = arduino
; Warnings for our sources only (the framework is not -Wextra clean).
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter  ; SoftDevice headers trip this
extra_scripts = post:scripts/make_uf2.py

[env:xiao_nrf52840]
; Seeed XIAO nRF52840 (non-mbed, Adafruit-based Seeed core: TinyUSB CDC + FreeRTOS).
; Platform pinned to a known-good commit for reproducible builds.
platform = https://github.com/maxgerhardt/platform-nordicnrf52#cac6fcf943a41accd2aeb4f3659ae297a73f422e
board = xiaoble_adafruit
build_flags =
    -DKMAN_BOARD_NAME=\"xiao_nrf52840\"

[env:xiao_nrf52840_abdomen]
extends = env:xiao_nrf52840
build_flags =
    ${env:xiao_nrf52840.build_flags}
    -DKMAN_ABDOMEN_IMU=1

[env:xiao_nrf52840_neck]
extends = env:xiao_nrf52840
build_flags =
    ${env:xiao_nrf52840.build_flags}
    -DKMAN_NECK_IMU=1
