; KMAN Step 1 — sensor streaming firmware.
;
; Build:   pio run -e xiao_nrf52840
; Flash:   pio run -e xiao_nrf52840 -t upload        (double-tap RESET if upload can't find the port)
;
; Every KMAN_* setting in include/config.h can be overridden per env with
; build_flags, e.g. -DKMAN_SAMPLE_RATE_HZ=200 -DKMAN_ABDOMEN_IMU=1

[platformio]
default_envs = xiao_nrf52840

[env]
framework = arduino
; Warnings for our sources only (the framework is not -Wextra clean).
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter  ; SoftDevice headers trip this

[env:xiao_nrf52840]
; Seeed XIAO nRF52840 (non-mbed, Adafruit-based Seeed core: TinyUSB CDC + FreeRTOS).
; Platform pinned to a known-good commit for reproducible builds.
platform = https://github.com/maxgerhardt/platform-nordicnrf52#cac6fcf943a41accd2aeb4f3659ae297a73f422e
board = xiaoble_adafruit
build_flags =
    -DKMAN_BOARD_NAME=\"xiao_nrf52840\"
