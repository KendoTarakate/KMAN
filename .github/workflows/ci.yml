# Tests the Python tools and builds every firmware variant (UF2 + HEX artifacts).
# Also called by release.yml, so a release ships exactly what CI built.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (includes decoding frames built by the firmware's C++ encoder)
        run: python -m pytest -q

  firmware:
    name: Firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [xiao_nrf52840, xiao_nrf52840_abdomen, xiao_nrf52840_neck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        # adafruit-nrfutil provides the Python modules the DFU-package step imports
        run: python -m pip install platformio adafruit-nrfutil
      - name: Build
        run: pio run -d firmware -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/kman-fw-*.uf2
            firmware/.pio/build/${{ matrix.env }}/kman-fw-*.hex
          if-no-files-found: error
