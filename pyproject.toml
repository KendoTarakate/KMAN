[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kman"
version = "0.1.0"
description = "Silent choking detector - Step 1: sensor logger and signal analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyserial>=3.5",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
live = ["pyqtgraph>=0.13.3", "PySide6>=6.5"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["host", "analysis"]
include = ["kman_host*", "kman_analysis*"]

[tool.pytest.ini_options]
pythonpath = ["host", "analysis"]
testpaths = ["host/tests", "analysis/tests"]
